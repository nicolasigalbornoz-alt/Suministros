<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Suministros - Municipalidad de Morón</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preload" href="/fonts/neo-sans-ultra.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="global.css?v=20261007a" />
  <link rel="stylesheet" href="styles.css?v=20261007a" />
</head>
<body>
  <div class="layout">
    <!-- HEADER, SIDEBAR y FOOTER se completan desde Layout (script.js), fuente única del marco compartido -->
    <header class="municipal-header" id="appHeader"></header>
    <aside class="sidebar" id="appSidebar"></aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="login-container">
        <div class="login-card">
          <h2>Sistema de Suministros</h2>
          <p class="subtitle">Subsecretaria de Planificación Presupuestaria y Estadísticas</p>

          <div class="login-section">
            <h3>Inicio de sesión</h3>

            <form id="loginForm" class="form">
              <div class="form-group">
                <label for="usuario">Legajo</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: 310019" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="username" required />
              </div>

              <div class="form-group">
                <label for="clave">Clave</label>
                <div class="password-field">
                  <input type="password" id="clave" name="clave" placeholder="" autocomplete="current-password" required />
                  <button type="button" id="toggleClave" class="toggle-clave" aria-label="Mostrar clave" aria-pressed="false">Ver</button>
                </div>
              </div>

              <label class="checkbox-group">
                <input type="checkbox" id="recordarUsuario" name="recordarUsuario" />
                <span>Recordar legajo</span>
              </label>

              <button type="submit" class="btn-login" id="loginSubmitBtn">Iniciar sesión</button>
            </form>
          </div>

          <div id="loginMessage" class="message" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="municipal-footer" id="appFooter"></footer>
  </div>

  <script src="script.js?v=20261007a" defer></script>
</body>
</html>
